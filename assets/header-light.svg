<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Firas Ridene, AI Engineer">
<style>
  .eb{font:600 14px ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace;letter-spacing:3px;fill:#5b5f6b}
  .nm{font:800 76px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;letter-spacing:-1px;fill:#14161c}
  .ol{font:800 76px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;letter-spacing:-1px;fill:none;stroke:#2553C4;stroke-width:1.6}
  .tg{font:500 18px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;fill:#5b5f6b}
  .lb{font:500 13px ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace;fill:#5b5f6b}
  .ag{font:700 12px ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace;fill:#fff;letter-spacing:1px}
  .ring{transform-origin:930px 170px;animation:ring 2.4s ease-out infinite}
